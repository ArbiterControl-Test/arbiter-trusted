name: trusted-workflows-tests

# The trusted repository's own CI (README step 1). It runs the starters' tests on every change to this repository,
# so an unpinned `uses:`, an added input or a removed safety step fails before it merges. Make its check required in
# this repository's protection. Python standard library only; nothing is installed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: trusted workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test and mutation tests
        run: python3 -I ci/trusted-workflows/selftest.py --mutations
      - name: Caller if
        run: python3 -I ci/trusted-workflows/caller_if_test.py
      - name: History pass
        run: python3 -I ci/trusted-workflows/history_test.py
      - name: Report retries
        run: python3 -I ci/trusted-workflows/report_retry_test.py
      - name: Behaviour
        run: python3 -I ci/trusted-workflows/behaviour.py
