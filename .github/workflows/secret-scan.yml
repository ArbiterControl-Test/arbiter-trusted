# Arbiter trusted secret scan (UC4, check name `gitleaks`). PLAN-177-R7 change 5 (ARB-264).
#
# Keep this file in your separate, protected trusted repository, at .github/workflows/secret-scan.yml.
# Your policy pins its commit; each pilot repository calls it from caller.yml. Read README.md first.
#
# The pull request controls the files scanned, not how they are scanned:
# * no inputs and no secrets; Arbiter's URL and audience are literals in the `report` job;
# * every `uses:` is pinned by commit, and every download is checked against a pinned sha256;
# * `scan` can only read the repository; it never runs the pull request's code;
# * `report` holds the identity-token permission, never touches the checkout, and takes only `conclusion` from `scan`.
#
# Edit only the two values marked SET-ME in `report`, and the exact-value exceptions in "Build the gitleaks config".

name: Arbiter trusted secret scan

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      conclusion: ${{ steps.result.outputs.conclusion }}
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Set up the work folders
        id: setup
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          rm -rf -- "$WORK"
          mkdir -p -- "$WORK/status" "$WORK/out" "$WORK/scratch" "$WORK/tools" "$WORK/cfg"
          : > "$WORK/cfg/empty-gitleaksignore"
          printf '0\n' > "$WORK/status/setup.status"

      # Fetches refs/pull/<number>/head from the base repository, which works for forks too. The checkout is only
      # read by scanners; no step runs code from it, so the fork opt-in below is safe here.
      - name: Check out the pull request head
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: src
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          allow-unsafe-pr-checkout: true

      - name: Verify the head and base commits
        id: verify-head
        timeout-minutes: 5
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          SRC="$GITHUB_WORKSPACE/src"
          g() { git -c core.attributesFile=/dev/null --literal-pathspecs -C "$SRC" "$@"; }
          for sha in "$PR_HEAD_SHA" "$PR_BASE_SHA"; do
            case "$sha" in
              *[!0-9a-f]*) echo "verify-head: a commit sha from the event is not lowercase hex"; exit 1 ;;
            esac
            if [ "${#sha}" -ne 40 ]; then echo "verify-head: a commit sha from the event is not 40 characters"; exit 1; fi
          done
          head="$(g rev-parse --verify 'HEAD^{commit}')"
          if [ "$head" != "$PR_HEAD_SHA" ]; then
            echo "verify-head: the fetched pull request head is not the event's head commit"
            exit 1
          fi
          if ! g cat-file -e "$PR_BASE_SHA^{commit}"; then
            echo "verify-head: the event's base commit is not in the fetched history"
            exit 1
          fi
          printf '0\n' > "$WORK/status/verify-head.status"

      # A path with a scanner-file name must be a regular file. A directory (or a symlink) with such a name could
      # carry other files out of the scan when planted files are moved, so the scan fails before anything moves.
      - name: Fail on a scanner-file name that is not a regular file
        id: dir-check
        timeout-minutes: 5
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          SRC="$GITHUB_WORKSPACE/src"
          g() { git -c core.attributesFile=/dev/null --literal-pathspecs -C "$SRC" "$@"; }
          cd -- "$SRC"
          find . -path ./.git -prune -o \( -name .gitattributes -o -name .gitleaksignore -o -name .gitleaks.toml -o -name osv-scanner.toml \) ! -type f -print0 > "$WORK/out/dir-check.nul"
          g ls-files -z > "$WORK/out/tracked.nul"
          bad=0
          while IFS= read -r -d '' p; do
            bad=$((bad + 1))
          done < "$WORK/out/dir-check.nul"
          while IFS= read -r -d '' p; do
            case "/$p" in
              */.gitattributes/*|*/.gitleaksignore/*|*/.gitleaks.toml/*|*/osv-scanner.toml/*) bad=$((bad + 1)) ;;
            esac
          done < "$WORK/out/tracked.nul"
          if [ "$bad" -ne 0 ]; then
            echo "dir-check: $bad path(s) with a scanner-file name are not regular files"
            exit 1
          fi
          echo "dir-check: 0 paths"
          printf '0\n' > "$WORK/status/dir-check.status"

      # Taken before any file moves. OSV-Scanner must read every file in this list (dependency-check.yml).
      - name: Take the lockfile inventory
        id: inventory
        timeout-minutes: 5
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          SRC="$GITHUB_WORKSPACE/src"
          cd -- "$SRC"
          find . -path ./.git -prune -o \( -type f -o -type l \) \( -name package-lock.json -o -name yarn.lock -o -name pnpm-lock.yaml -o -name requirements.txt -o -name poetry.lock -o -name Pipfile.lock -o -name go.sum -o -name Cargo.lock -o -name Gemfile.lock -o -name composer.lock -o -name pom.xml -o -name gradle.lockfile \) -print0 > "$WORK/out/lockfiles.nul"
          count="$(tr -cd '\000' < "$WORK/out/lockfiles.nul" | wc -c)"
          echo "inventory: $count lockfile(s)"
          printf '0\n' > "$WORK/status/inventory.status"

      # The control for scanner settings a pull request could plant: every .gitattributes, .gitleaksignore,
      # .gitleaks.toml and osv-scanner.toml, and .git/info/attributes, is moved to the scratch folder (which is
      # scanned too) and dropped from git's index. The tree is then rewritten from git's objects with no
      # attributes in force, so a planted attribute cannot change what the scanners read.
      - name: Move planted scanner files out
        id: move-planted
        timeout-minutes: 10
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          SRC="$GITHUB_WORKSPACE/src"
          g() { git -c core.attributesFile=/dev/null --literal-pathspecs -C "$SRC" "$@"; }
          cd -- "$SRC"
          find . -path ./.git -prune -o -type f \( -name .gitattributes -o -name .gitleaksignore -o -name .gitleaks.toml -o -name osv-scanner.toml \) -print0 > "$WORK/out/planted.nul"
          n=0
          while IFS= read -r -d '' p; do
            n=$((n + 1))
            mv -- "$p" "$WORK/scratch/moved-$n.txt"
            g rm --cached --quiet --ignore-unmatch -- "$p"
          done < "$WORK/out/planted.nul"
          if [ -e .git/info/attributes ] || [ -L .git/info/attributes ]; then
            n=$((n + 1))
            mv -- .git/info/attributes "$WORK/scratch/moved-$n.txt"
          fi
          g checkout-index --all --force
          echo "move-planted: $n file(s) moved"
          printf '0\n' > "$WORK/status/move-planted.status"

      # Fails on: a submodule (gitlink), a symlink that leaves the tree, a Git LFS pointer, a file over 5 MB, an
      # archive nested deeper than 2, an archive it cannot read, or an archive format it does not support. Every
      # readable archive member (to depth 2) is written to the scratch folder, so the scans read it.
      - name: Check the tree is plain
        id: plain-tree
        timeout-minutes: 15
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          SRC="$GITHUB_WORKSPACE/src"
          g() { git -c core.attributesFile=/dev/null --literal-pathspecs -C "$SRC" "$@"; }
          g ls-files -s -z > "$WORK/out/index.nul"
          gitlinks=0
          while IFS= read -r -d '' entry; do
            case "$entry" in
              160000\ *) gitlinks=$((gitlinks + 1)) ;;
            esac
          done < "$WORK/out/index.nul"
          echo "plain-tree: $gitlinks gitlink(s)"
          if [ "$gitlinks" -ne 0 ]; then exit 1; fi
          cd -- "$WORK"
          python3 -I - "$SRC" "$WORK/scratch" <<'PY'
          import bz2, gzip, io, lzma, os, stat, subprocess, sys, tarfile, threading, zipfile

          SRC = os.path.realpath(os.fsencode(sys.argv[1]))
          SCRATCH = os.fsencode(sys.argv[2])
          LIMIT = 5_000_000  # bytes; gitleaks --max-target-megabytes 5 skips anything larger
          LINK_LIMIT = 4096  # bytes; a symlink's target is a path, never longer than PATH_MAX
          MAX_DEPTH = 2  # gitleaks --max-archive-depth 2
          MAX_TOTAL = 200_000_000  # all archive members together
          MAX_MEMBERS = 20_000
          ARCHIVE_EXT = (b".zip", b".jar", b".war", b".ear", b".aar", b".apk", b".ipa", b".whl", b".egg", b".nupkg",
                         b".xpi", b".crx", b".vsix", b".tar", b".tgz", b".gz", b".tbz", b".tbz2", b".bz2", b".txz",
                         b".xz", b".lzma", b".lz", b".lz4", b".zst", b".tzst", b".7z", b".rar", b".cab", b".deb",
                         b".rpm", b".cpio", b".iso", b".dmg", b".z", b".sz", b".br", b".arj", b".lzh")
          UNSUPPORTED = (b"7z\xbc\xaf\x27\x1c", b"Rar!\x1a\x07", b"\x28\xb5\x2f\xfd", b"\x04\x22\x4d\x18", b"LZIP",
                         b"\x1f\x9d", b"\x1f\xa0", b"MSCF", b"!<arch>\n", b"\xed\xab\xee\xdb", b"\x89LZO", b"\xff\x06\x00\x00sNaPpY")
          count = {"outside symlinks": 0, "LFS pointers": 0, "files over 5 MB": 0, "files over 5 MB in history": 0,
                   "symlinks that are not links": 0, "archives nested too deep": 0,
                   "archives unreadable": 0, "archive formats not supported": 0}
          state = {"members": 0, "total": 0, "written": 0}


          class Limit(Exception):
              pass


          def kind_of(data, name):
              if data[:4] in (b"PK\x03\x04", b"PK\x05\x06", b"PK\x07\x08"):
                  return "zip"
              if data[:2] == b"\x1f\x8b":
                  return "gzip"
              if data[:3] == b"BZh":
                  return "bzip2"
              if data[:6] == b"\xfd7zXZ\x00":
                  return "xz"
              if data[257:262] == b"ustar":
                  return "tar"
              if data.startswith(UNSUPPORTED):
                  return "unsupported"
              if name.lower().endswith(ARCHIVE_EXT):
                  return "unreadable"
              return None


          def bounded(f):
              data = f.read(LIMIT + 1)
              if len(data) > LIMIT:
                  count["files over 5 MB"] += 1
                  return None
              return data


          def tick():
              state["members"] += 1
              if state["members"] > MAX_MEMBERS:
                  raise Limit()


          def members(kind, data):
              if kind == "zip":
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      for info in z.infolist():
                          tick()
                          if info.is_dir():
                              continue
                          with z.open(info) as f:
                              yield info.filename.encode("utf-8", "surrogateescape"), bounded(f)
                  return
              try:
                  tf = tarfile.open(fileobj=io.BytesIO(data), mode="r:*")
              except tarfile.TarError:
                  tf = None
              if tf is not None:
                  with tf:
                      for m in tf:
                          tick()
                          if m.isfile():
                              yield m.name.encode("utf-8", "surrogateescape"), bounded(tf.extractfile(m))
                  return
              if kind == "tar":
                  raise ValueError("not a tar")
              opener = {"gzip": gzip.GzipFile, "bzip2": bz2.BZ2File, "xz": lzma.LZMAFile}[kind]
              tick()
              with opener(fileobj=io.BytesIO(data)) if kind == "gzip" else opener(io.BytesIO(data)) as f:
                  yield b"member", bounded(f)


          def emit(data):
              state["total"] += len(data)
              if state["total"] > MAX_TOTAL:
                  raise Limit()
              state["written"] += 1
              with open(os.path.join(SCRATCH, b"archive-%d.txt" % state["written"]), "wb") as out:
                  out.write(data)


          def visit(data, name, depth):
              kind = kind_of(data, name)
              if kind is None:
                  if depth > 0:
                      emit(data)
                  return
              if kind == "unsupported":
                  count["archive formats not supported"] += 1
                  return
              if kind == "unreadable":
                  count["archives unreadable"] += 1
                  return
              if depth + 1 > MAX_DEPTH:
                  count["archives nested too deep"] += 1
                  return
              try:
                  for member_name, member in members(kind, data):
                      if member is not None:
                          visit(member, member_name, depth + 1)
              except Limit:
                  raise
              except Exception:
                  count["archives unreadable"] += 1


          def inside(path):
              real = os.path.realpath(path)
              return real == SRC or real.startswith(SRC + b"/")


          def check_file(path):
              st = os.lstat(path)
              if stat.S_ISLNK(st.st_mode):
                  if not inside(path):
                      count["outside symlinks"] += 1
                  return
              if not stat.S_ISREG(st.st_mode):
                  return
              if st.st_size > LIMIT:
                  count["files over 5 MB"] += 1
                  return
              with open(path, "rb") as f:
                  data = f.read()
              if data.startswith(b"version https://git-lfs.github.com/spec/"):
                  count["LFS pointers"] += 1
                  return
              visit(data, os.path.basename(path), 0)


          def git(*args, data=None):
              cmd = [b"git", b"-c", b"core.attributesFile=/dev/null", b"--literal-pathspecs", b"-C", SRC] + list(args)
              return subprocess.run(cmd, input=data, stdout=subprocess.PIPE, check=True).stdout


          def history():
              """Holds to the head's limits every blob the head does not read as a regular file: a blob the pull request's
              commits add and the head no longer has (a file added, then deleted again), and every symlink's content, at the
              head or in the range. The range scan reads history only as patches: it skips one over 5 MB without a warning and
              never unpacks an archive. A symlink's target is a short path: one too long, or holding a NUL byte, is something
              else stored as a link, and fails. An archive's members go to the scratch folder."""
              base, head = os.environb[b"PR_BASE_SHA"], os.environb[b"PR_HEAD_SHA"]
              regular, links = set(), {}
              for entry in git(b"ls-tree", b"-r", b"-z", head).split(b"\0"):
                  if entry:
                      meta, _, path = entry.partition(b"\t")
                      mode, _, oid = meta.split(b" ")
                      if mode in (b"100644", b"100755"):
                          regular.add(oid)
                      elif mode == b"120000":
                          links[oid] = os.path.basename(path)
              names = {}
              tokens = git(b"log", b"-m", b"-z", b"--raw", b"--no-abbrev", b"--no-renames", b"--format=",
                           base + b".." + head).split(b"\0")
              for meta, path in zip(tokens, tokens[1:]):
                  if meta.startswith(b":"):
                      fields = meta.split(b" ")
                      names[fields[3]] = os.path.basename(path)
                      if fields[1] == b"120000":
                          links.setdefault(fields[3], os.path.basename(path))
              oids = git(b"rev-list", b"--objects", b"--no-object-names", base + b".." + head).split()
              sizes = git(b"cat-file", b"--batch-check=%(objecttype) %(objectname) %(objectsize)",
                          data=b"".join(o + b"\n" for o in list(links) + oids)).splitlines()
              wanted, seen = [], set()
              for line in sizes:
                  kind, oid, size = line.split(b" ")
                  if kind != b"blob" or oid in seen or (oid in regular and oid not in links):
                      continue
                  seen.add(oid)
                  if oid in links and int(size) > LINK_LIMIT:
                      count["symlinks that are not links"] += 1
                  elif int(size) > LIMIT:
                      count["files over 5 MB in history"] += 1
                  else:
                      wanted.append(oid)
              proc = subprocess.Popen([b"git", b"-c", b"core.attributesFile=/dev/null", b"-C", SRC, b"cat-file", b"--batch"],
                                      stdin=subprocess.PIPE, stdout=subprocess.PIPE)
              feed = threading.Thread(target=lambda: (proc.stdin.write(b"".join(o + b"\n" for o in wanted)), proc.stdin.close()))
              feed.start()
              for oid in wanted:
                  header = proc.stdout.readline().split(b" ")
                  if header[0] != oid or header[1] != b"blob":
                      raise RuntimeError("cat-file returned an unexpected object")
                  data = proc.stdout.read(int(header[2]))
                  proc.stdout.read(1)
                  if oid in links and b"\0" in data:
                      count["symlinks that are not links"] += 1
                  elif data.startswith(b"version https://git-lfs.github.com/spec/"):
                      count["LFS pointers"] += 1
                  else:
                      visit(data, links.get(oid) or names.get(oid, b""), 0)
              feed.join()
              if proc.wait() != 0:
                  raise RuntimeError("cat-file failed")


          def walk_error(err):
              raise err


          moved = sorted(os.path.join(SCRATCH, f) for f in os.listdir(SCRATCH) if f.startswith(b"moved-"))
          try:
              for root, dirs, files in os.walk(SRC, followlinks=False, onerror=walk_error):
                  if root == SRC and b".git" in dirs:
                      dirs.remove(b".git")
                  for d in dirs:
                      p = os.path.join(root, d)
                      if os.path.islink(p) and not inside(p):
                          count["outside symlinks"] += 1
                  for f in files:
                      check_file(os.path.join(root, f))
              for p in moved:
                  check_file(p)
              history()
          except Limit:
              print("plain-tree: archive members over the extraction limit")
              sys.exit(1)
          for name, n in count.items():
              print("plain-tree: %d %s" % (n, name))
          print("plain-tree: %d archive member(s) written for scanning" % state["written"])
          sys.exit(1 if any(count.values()) else 0)
          PY
          printf '0\n' > "$WORK/status/plain-tree.status"

      # Gitleaks may skip a file it treats as binary. Each such file (a NUL byte, or not UTF-8) is also written as
      # the output of `strings -a -n 8`, so a secret behind an image header and a NUL byte is still read.
      - name: Extract text from binary files
        id: binary-text
        timeout-minutes: 15
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          SRC="$GITHUB_WORKSPACE/src"
          cd -- "$WORK"
          python3 -I - "$SRC" "$WORK/scratch" <<'PY'
          import os, stat, subprocess, sys

          SRC = os.fsencode(sys.argv[1])
          SCRATCH = os.fsencode(sys.argv[2])
          targets = []


          def walk_error(err):
              raise err


          for root, dirs, files in os.walk(SRC, followlinks=False, onerror=walk_error):
              if root == SRC and b".git" in dirs:
                  dirs.remove(b".git")
              for f in files:
                  targets.append(os.path.join(root, f))
          for f in sorted(os.listdir(SCRATCH)):
              if f.startswith((b"moved-", b"archive-")):
                  targets.append(os.path.join(SCRATCH, f))
          n = 0
          for p in targets:
              if not stat.S_ISREG(os.lstat(p).st_mode):
                  continue
              with open(p, "rb") as fh:
                  data = fh.read()
              binary = b"\0" in data
              if not binary:
                  try:
                      data.decode("utf-8")
                  except UnicodeDecodeError:
                      binary = True
              if binary:
                  n += 1
                  with open(os.path.join(SCRATCH, b"strings-%d.txt" % n), "wb") as out:
                      subprocess.run([b"strings", b"-a", b"-n", b"8", b"--", p], stdout=out, check=True)
          print("binary-text: %d binary file(s) written as text" % n)
          PY
          printf '0\n' > "$WORK/status/binary-text.status"

      - name: Install the pinned gitleaks
        id: install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          # gitleaks 8.30.1, linux x64, sha256 from the release's gitleaks_8.30.1_checksums.txt.
          GITLEAKS_SHA256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          cd -- "$WORK/tools"
          curl -fsSL --proto '=https' --max-time 120 -o gitleaks.tar.gz 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          printf '%s  %s\n' "$GITLEAKS_SHA256" gitleaks.tar.gz | sha256sum --check --quiet --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f -- gitleaks.tar.gz
          chmod 0755 -- "$WORK/tools/gitleaks"
          printf '0\n' > "$WORK/status/install.status"

      # The rules are gitleaks 8.30.1's default rules with every allowlist removed, plus the UC4 test rule and the
      # exact-value exceptions below. The rule IDs and count are checked against the reviewed manifest
      # (gitleaks/rules-manifest.txt), so a rule cannot go missing unnoticed.
      - name: Build the gitleaks config
        id: build-config
        timeout-minutes: 5
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          # config/gitleaks.toml at gitleaks v8.30.1 (commit 83d9cd684c87d95d656c1458ef04895a7f1cbd8e).
          DEFAULT_CONFIG_SHA256='e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf'
          RULE_COUNT='223'
          RULE_IDS_SHA256='1e874f81cf31e76f5f9c4fe923efc684f662dfae43313ee5acd0b44485281ba1'
          curl -fsSL --proto '=https' --max-time 60 -o "$WORK/cfg/default.toml" 'https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml'
          printf '%s  %s\n' "$DEFAULT_CONFIG_SHA256" "$WORK/cfg/default.toml" | sha256sum --check --quiet --strict -
          : > "$WORK/cfg/exceptions.nul"
          add_exception() { printf '%s\0%s\0' "$1" "$2" >> "$WORK/cfg/exceptions.nul"; }
          # Exact-value exceptions, per repository. Each names the rule that fires and the whole match text gitleaks
          # reports for one fake value (key name and quotes included). Never a path, a glob or a fingerprint.
          # The example-org/example-repo entry is an example: replace it with yours, or delete it.
          case "$GITHUB_REPOSITORY" in
          esac
          python3 -I - "$WORK/cfg/default.toml" "$WORK/cfg/exceptions.nul" "$WORK/cfg/gitleaks.toml" "$RULE_COUNT" "$RULE_IDS_SHA256" <<'PY'
          import hashlib, sys, tomllib

          src, exceptions_path, out_path, want_count, want_sha = sys.argv[1:6]
          UC4_RULE = {
              "id": "arbiter-uc4-test-secret",
              "description": "Arbiter UC4 test secret: a fake value for the live tests, not a real provider format.",
              "regex": "ARBITER-UC4-TEST-[0-9a-f]{32}",
              "keywords": ["arbiter-uc4-test-"],
          }
          TOP_KEYS = {"title", "minVersion", "allowlist", "allowlists", "rules"}
          RULE_KEYS = {"id", "description", "regex", "secretGroup", "entropy", "keywords", "path", "allowlist", "allowlists"}


          def fail(msg):
              print("build-config: " + msg)
              sys.exit(1)


          with open(src, "rb") as f:
              cfg = tomllib.load(f)
          if "extend" in cfg:
              fail("the default config uses extend")
          if set(cfg) - TOP_KEYS:
              fail("the default config has keys this build does not know")
          cfg.pop("allowlist", None)
          cfg.pop("allowlists", None)
          for rule in cfg["rules"]:
              if set(rule) - RULE_KEYS:
                  fail("a default rule has keys this build does not know")
              rule.pop("allowlist", None)
              rule.pop("allowlists", None)
          cfg["rules"].append(dict(UC4_RULE))
          ids = [r["id"] for r in cfg["rules"]]
          if len(set(ids)) != len(ids):
              fail("duplicate rule IDs")
          listing = "".join(i + "\n" for i in sorted(ids)).encode()
          if len(ids) != int(want_count) or hashlib.sha256(listing).hexdigest() != want_sha:
              fail("the rule IDs differ from the reviewed manifest")


          def rx_escape(s):
              out = []
              for ch in s:
                  o = ord(ch)
                  if o < 0x80 and (ch.isalnum() or ch == "_"):
                      out.append(ch)
                  elif 0x20 <= o < 0x7F:
                      out.append("\\" + ch)
                  elif o < 0x80:
                      out.append("\\x{%02x}" % o)
                  else:
                      out.append(ch)
              return "".join(out)


          with open(exceptions_path, "rb") as f:
              raw = f.read()
          parts = raw.split(b"\0")
          if parts[-1] != b"" or len(parts) % 2 != 1:
              fail("bad exception list")
          by_id = {r["id"]: r for r in cfg["rules"]}
          for i in range(0, len(parts) - 1, 2):
              rule_id = parts[i].decode("utf-8")
              match = parts[i + 1].decode("utf-8")
              if rule_id not in by_id or match == "":
                  fail("an exception names an unknown rule or an empty value")
              by_id[rule_id].setdefault("allowlists", []).append({
                  "description": "exact-value exception",
                  "regexTarget": "match",
                  "regexes": ["^" + rx_escape(match) + "$"],
              })


          def toml_str(s):
              out = ['"']
              for ch in s:
                  o = ord(ch)
                  if ch == '"':
                      out.append('\\"')
                  elif ch == "\\":
                      out.append("\\\\")
                  elif o < 0x20 or o == 0x7F:
                      out.append("\\u%04X" % o)
                  else:
                      out.append(ch)
              out.append('"')
              return "".join(out)


          def toml_val(v):
              if isinstance(v, bool):
                  return "true" if v else "false"
              if isinstance(v, (int, float)):
                  return repr(v)
              if isinstance(v, str):
                  return toml_str(v)
              if isinstance(v, list):
                  return "[" + ", ".join(toml_val(x) for x in v) + "]"
              fail("unexpected value type")


          lines = []
          for k, v in cfg.items():
              if k != "rules":
                  lines.append("%s = %s" % (k, toml_val(v)))
          for rule in cfg["rules"]:
              lines.append("")
              lines.append("[[rules]]")
              for k, v in rule.items():
                  if k != "allowlists":
                      lines.append("%s = %s" % (k, toml_val(v)))
              for al in rule.get("allowlists", []):
                  lines.append("[[rules.allowlists]]")
                  for k, v in al.items():
                      lines.append("%s = %s" % (k, toml_val(v)))
          text = "\n".join(lines) + "\n"
          check = tomllib.loads(text)
          if "allowlist" in check or "allowlists" in check or "extend" in check:
              fail("the built config has a global allowlist")
          for rule in check["rules"]:
              for al in rule.get("allowlists", []):
                  if set(al) != {"description", "regexTarget", "regexes"} or al["regexTarget"] != "match":
                      fail("the built config has an allowlist other than an exact-value exception")
          with open(out_path, "w", encoding="utf-8") as f:
              f.write(text)
          print("build-config: %d rules" % len(check["rules"]))
          PY
          printf '0\n' > "$WORK/status/build-config.status"

      # Each scanner's output goes to a file. Its exit status is written to its own file. A log line other than
      # gitleaks' info lines and its "leaks found" count (for example a skipped file) fails the scan as well.
      - name: Scan the commit range with gitleaks
        id: gitleaks-range
        timeout-minutes: 20
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          SRC="$GITHUB_WORKSPACE/src"
          cd -- "$WORK"
          # Through a variable: written inline, the setting's name reads to gitleaks as a key (a finding in this file).
          ATTRIBUTES_SETTING=core.attributesFile
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="$ATTRIBUTES_SETTING" GIT_CONFIG_VALUE_0=/dev/null
          set +e
          "$WORK/tools/gitleaks" git "$SRC" --log-opts="--no-ext-diff --no-textconv --text $PR_BASE_SHA..$PR_HEAD_SHA" --config "$WORK/cfg/gitleaks.toml" --gitleaks-ignore-path "$WORK/cfg/empty-gitleaksignore" --ignore-gitleaks-allow --max-target-megabytes 100 --max-archive-depth 2 --no-banner --no-color --redact --log-level info --report-format json --report-path "$WORK/out/gitleaks-range.json" > "$WORK/out/gitleaks-range.log" 2>&1
          printf '%s\n' "$?" > "$WORK/status/gitleaks-range.status"
          awk '!/^[0-9]+:[0-9]+[AP]M INF / && !/^[0-9]+:[0-9]+[AP]M WRN leaks found: [0-9]+$/ { bad++ } END { print (bad ? 1 : 0) }' "$WORK/out/gitleaks-range.log" > "$WORK/status/gitleaks-range-log.status"
          set -e
          echo "gitleaks range scan: exit status recorded; findings: $(jq 'length' < "$WORK/out/gitleaks-range.json" 2>/dev/null || echo unknown)"

      - name: Scan the tree with gitleaks
        id: gitleaks-tree
        timeout-minutes: 20
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          SRC="$GITHUB_WORKSPACE/src"
          cd -- "$WORK"
          set +e
          "$WORK/tools/gitleaks" dir "$SRC" --config "$WORK/cfg/gitleaks.toml" --gitleaks-ignore-path "$WORK/cfg/empty-gitleaksignore" --ignore-gitleaks-allow --max-target-megabytes 5 --max-archive-depth 2 --no-banner --no-color --redact --log-level info --report-format json --report-path "$WORK/out/gitleaks-tree.json" > "$WORK/out/gitleaks-tree.log" 2>&1
          printf '%s\n' "$?" > "$WORK/status/gitleaks-tree.status"
          awk '!/^[0-9]+:[0-9]+[AP]M INF / && !/^[0-9]+:[0-9]+[AP]M WRN leaks found: [0-9]+$/ { bad++ } END { print (bad ? 1 : 0) }' "$WORK/out/gitleaks-tree.log" > "$WORK/status/gitleaks-tree-log.status"
          set -e
          echo "gitleaks tree scan: exit status recorded; findings: $(jq 'length' < "$WORK/out/gitleaks-tree.json" 2>/dev/null || echo unknown)"

      - name: Scan the scratch folder with gitleaks
        id: gitleaks-scratch
        timeout-minutes: 20
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          cd -- "$WORK"
          set +e
          "$WORK/tools/gitleaks" dir "$WORK/scratch" --config "$WORK/cfg/gitleaks.toml" --gitleaks-ignore-path "$WORK/cfg/empty-gitleaksignore" --ignore-gitleaks-allow --max-target-megabytes 5 --max-archive-depth 2 --no-banner --no-color --redact --log-level info --report-format json --report-path "$WORK/out/gitleaks-scratch.json" > "$WORK/out/gitleaks-scratch.log" 2>&1
          printf '%s\n' "$?" > "$WORK/status/gitleaks-scratch.status"
          awk '!/^[0-9]+:[0-9]+[AP]M INF / && !/^[0-9]+:[0-9]+[AP]M WRN leaks found: [0-9]+$/ { bad++ } END { print (bad ? 1 : 0) }' "$WORK/out/gitleaks-scratch.log" > "$WORK/status/gitleaks-scratch-log.status"
          set -e
          echo "gitleaks scratch scan: exit status recorded; findings: $(jq 'length' < "$WORK/out/gitleaks-scratch.json" 2>/dev/null || echo unknown)"

      # Reads only the recorded exit statuses. `success` only if every one exists and is 0; anything else
      # (a finding, a crash, a timeout, a skipped step) is `failure`.
      - name: Set the conclusion
        id: result
        if: always()
        timeout-minutes: 2
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/arbiter-trusted"
          conclusion='success'
          for s in setup verify-head dir-check inventory move-planted plain-tree binary-text install build-config gitleaks-range gitleaks-range-log gitleaks-tree gitleaks-tree-log gitleaks-scratch gitleaks-scratch-log; do
            f="$WORK/status/$s.status"
            if [ ! -f "$f" ] || [ "$(cat -- "$f")" != '0' ]; then
              conclusion='failure'
            fi
          done
          printf 'conclusion=%s\n' "$conclusion" >> "$GITHUB_OUTPUT"
          echo "conclusion: $conclusion"
          if [ "$conclusion" != 'success' ]; then exit 1; fi

  report:
    name: report
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SCAN_RESULT: ${{ needs.scan.result }}
      SCAN_CONCLUSION: ${{ needs.scan.outputs.conclusion }}
    steps:
      # Posts {check, head_sha, conclusion} to Arbiter with this job's identity token. A 429, a 503 or a network
      # error is retried 3 times with backoff; one 401 is retried once after 60 seconds. Then the job fails.
      - name: Send the result to Arbiter
        id: send
        run: |
          set -euo pipefail
          ARBITER_URL='https://arbiter-e2e.cyklr.com' # SET-ME: your Arbiter's address
          ARBITER_AUDIENCE='arbiter-e2e-test' # SET-ME: your ARBITER_OIDC_AUDIENCE
          CHECK='gitleaks'
          case "$PR_NUMBER" in
            ''|0*|*[!0-9]*) echo "report: the pull request number is not a number"; exit 1 ;;
          esac
          case "$PR_HEAD_SHA" in
            *[!0-9a-f]*) echo "report: the head sha is not lowercase hex"; exit 1 ;;
          esac
          if [ "${#PR_HEAD_SHA}" -ne 40 ]; then echo "report: the head sha is not 40 characters"; exit 1; fi
          case "$GITHUB_REPOSITORY" in
            */*/*|/*|*/|*[!A-Za-z0-9._/-]*) echo "report: unexpected repository name"; exit 1 ;;
            */*) ;;
            *) echo "report: unexpected repository name"; exit 1 ;;
          esac
          conclusion='failure'
          if [ "$SCAN_RESULT" = 'success' ] && [ "$SCAN_CONCLUSION" = 'success' ]; then
            conclusion='success'
          fi
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          printf '{"check":"%s","head_sha":"%s","conclusion":"%s"}' "$CHECK" "$PR_HEAD_SHA" "$conclusion" > "$work/body.json"
          url="$ARBITER_URL/api/trusted-check-results/$GITHUB_REPOSITORY/$PR_NUMBER"

          get_token() {
            printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$work/request.h"
            curl -fsS --max-time 30 --connect-timeout 10 -G --data-urlencode "audience=$ARBITER_AUDIENCE" -H @"$work/request.h" -o "$work/token.json" --url "$ACTIONS_ID_TOKEN_REQUEST_URL" 2> "$work/curl.err" || return 1
            jq -er '.value | select(type == "string" and length > 0)' < "$work/token.json" > "$work/token" || return 1
            { printf 'Authorization: Bearer '; tr -d '\n' < "$work/token"; printf '\n'; } > "$work/auth.h"
            rm -f -- "$work/token" "$work/token.json" "$work/request.h"
          }

          post() {
            curl -sS --max-time 30 --connect-timeout 10 -o "$work/response.json" -w '%{http_code}' -H @"$work/auth.h" -H 'Content-Type: application/json' --data-binary @"$work/body.json" --url "$url" 2> "$work/curl.err" || true
          }

          retries=0
          retried_401='no'
          have_token='no'
          while true; do
            code='000'
            if [ "$have_token" = 'yes' ] || get_token; then
              have_token='yes'
              code="$(post)"
            fi
            case "$code" in
              200|201)
                echo "report: Arbiter answered $code; conclusion $conclusion"
                exit 0
                ;;
              401)
                if [ "$retried_401" = 'no' ]; then
                  retried_401='yes'
                  have_token='no'
                  echo "report: Arbiter answered 401; one more try in 60 seconds"
                  sleep 60
                  continue
                fi
                ;;
              429|503|000)
                if [ "$retries" -lt 3 ]; then
                  retries=$((retries + 1))
                  delay=$((5 * (1 << retries)))
                  echo "report: Arbiter answered $code; retry $retries of 3 in $delay seconds"
                  sleep "$delay"
                  continue
                fi
                ;;
            esac
            echo "report: giving up; Arbiter's last answer was $code"
            exit 1
          done
